<article class="card venue-card mb-3">
  <div class="card-body">
    <h2 class="card-title h5">{{ venue.name|default:"Без названия" }}</h2>
    <p class="card-text text-muted">{{ venue.address|default:"адрес не указан" }}</p>
    <p class="card-text">Вместимость: до {{ venue.capacity }} чел.</p>
    <a href="{% url 'venues:detail' venue.id %}" class="btn btn-primary btn-sm">
      Подробнее
    </a>
  </div>
</article>
